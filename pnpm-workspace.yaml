packages:
  - apps/*
  - packages/*

# One place for shared dependency versions. Packages reference these with "catalog:".
catalog:
  '@eslint/js': ^10.0.1
  '@hono/node-server': ^2.1.6
  '@hono/zod-validator': ^0.9.1
  '@sentry/node': ^11.9.0
  '@sentry/react': ^11.11.0
  '@types/node': ^24.19.2
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.2.1
  '@vitest/coverage-v8': ^5.1.0
  # Better Auth's CLI ships as the `auth` package and is versioned with better-auth.
  auth: ^1.7.18
  better-auth: ^1.7.18
  # Drizzle v1 is still a release candidate; stay on 0.x (patch updates only) until it's stable.
  drizzle-kit: ~0.31.11
  drizzle-orm: ~0.45.4
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  fast-check: ^4.10.2
  globals: ^17.14.0
  hono: ^4.13.16
  pg: ^8.23.1
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tsup: ^9.0.0
  tsx: ^4.23.15
  turbo: ^2.11.10
  # typescript-eslint supports TypeScript < 6.1, so we stay on 6.0.x for now.
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  vite: ^8.3.6
  vitest: ^5.1.0
  zod: ^4.6.7

# pnpm blocks dependency install scripts by default. Allow only the ones we need.
onlyBuiltDependencies:
  - esbuild
